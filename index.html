<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBFAF8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141514" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="账本">
<title>我的账本</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23CBECE6'/%3E%3Cpath d='M20 14h24l2 34-5-3-5 4-5-4-5 4-5-4-4 3z' fill='white' stroke='%231A1A1A' stroke-width='3' stroke-linejoin='round'/%3E%3Cpath d='M25 24h14M25 31h10' stroke='%231A1A1A' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --paper:#FBFAF8; --card:#F3F2EF; --card-2:#E8E6E1; --ink:#1A1A1A; --ink-2:#75736F; --ink-3:#A9A6A1;
  --mint:#CBECE6; --mint-ink:#1E4C45; --pill:#DCE6E2; --hint-bg:#F1F4D6;
  --accent:var(--mint-ink); --btn-bg:var(--mint); --btn-ink:var(--mint-ink); --chip-on-bg:var(--mint); --chip-on-ink:var(--mint-ink); --line:transparent;
  --d-yellow:#F5C94A; --d-blush:#F3A6A0;
  --serif:ui-serif,"New York","Iowan Old Style",Georgia,"Songti SC","Noto Serif CJK SC","Source Han Serif SC",serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --up:#C9533D; --down:#3B8A5C;
  --seg-var:#1A1A1A; --seg-fix:#9CC8BF; --seg-big:#D3E65A;
  --d-sage:#8EAD7C; --d-lime:#DDEF6C; --doodle-bg:var(--paper);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC",system-ui,sans-serif;
  --num:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141514; --card:#1F201F; --card-2:#2B2D2B; --ink:#EDEDEA; --ink-2:#A3A19C; --ink-3:#6F6D69;
    --mint:#24443F; --mint-ink:#BFE8E0; --pill:#2C3835; --hint-bg:#262A17;
    --up:#E77C66; --down:#6CBE8C;
    --seg-var:#EDEDEA; --seg-fix:#4F7C73; --seg-big:#B7C94A;
    --d-sage:#7E9C6E; --d-lime:#C9DB5C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#141514; --card:#1F201F; --card-2:#2B2D2B; --ink:#EDEDEA; --ink-2:#A3A19C; --ink-3:#6F6D69;
  --mint:#24443F; --mint-ink:#BFE8E0; --pill:#2C3835; --hint-bg:#262A17;
  --up:#E77C66; --down:#6CBE8C;
  --seg-var:#EDEDEA; --seg-fix:#4F7C73; --seg-big:#B7C94A;
  --d-sage:#7E9C6E; --d-lime:#C9DB5C;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 var(--font);-webkit-font-smoothing:antialiased;padding-bottom:calc(78px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}

/* 顶栏 */
.top{position:sticky;top:0;z-index:5;background:var(--paper)}
.top-in{max-width:640px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px}
.circle{width:44px;height:44px;border-radius:50%;border:0;background:var(--card);display:grid;place-items:center;color:var(--ink)}
.circle:active{background:var(--card-2)}
.circle svg{width:22px;height:22px}
.ttl{text-align:center;border:0;background:none;padding:0;line-height:1.3}
.ttl b{display:block;font-size:18px;font-weight:650}
.ttl span{display:block;font-size:13px;color:var(--ink-2)}
main{max-width:640px;margin:0 auto;padding:6px 16px 28px}
main.has-fab{padding-bottom:96px}

/* 卡片 */
.card{background:var(--card);border-radius:24px;padding:18px;margin:0 0 12px;--doodle-bg:var(--card)}
.card h2{font-size:14px;font-weight:500;color:var(--ink-2);margin:0 0 12px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.aside{font-weight:400;color:var(--ink-3);font-size:13px}
.link{border:0;background:none;color:var(--accent);padding:0;font-size:13.5px;font-weight:550}
.lab{display:flex;align-items:center;gap:6px;color:var(--ink-2);font-size:14px}
.emo{font-size:19px;line-height:1}

.hero{position:relative;padding:18px 18px 16px}
.hero .doodle{position:absolute;top:10px;right:12px;width:62px}
.hero-num{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:clamp(40px,12.5vw,52px);font-weight:700;line-height:1.1;letter-spacing:-.02em;margin:10px 0 6px}
.hero-num small{font-size:.5em;font-weight:600;color:var(--ink-2);letter-spacing:0}
.hero-sub{font-size:13.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:2px}
.up{color:var(--up)} .down{color:var(--down)}
.comp{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--card-2);margin:16px 0 12px;gap:2px}
.comp span{display:block}
.comp-legend{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg{border:0;background:none;padding:0;text-align:left;font-size:12.5px;color:var(--ink-2)}
.seg i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:1px}
.seg b{display:block;font-family:var(--num);font-variant-numeric:tabular-nums;font-size:15px;font-weight:650;color:var(--ink);margin-top:2px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.duo .card{margin:0;padding:16px 18px}
.duo b{display:block;font-family:var(--num);font-variant-numeric:tabular-nums;font-size:22px;font-weight:700;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.strip{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;border:0;background:var(--hint-bg);color:var(--ink);border-radius:20px;padding:14px 16px;margin:0 0 12px;font-weight:500;text-align:left;text-decoration:none;font-size:14.5px}
.strip::before{content:"";flex:none;width:10px;height:10px;border-radius:50%;background:var(--d-lime);box-shadow:0 0 0 2px var(--ink) inset}
.strip span{flex:1}
.strip span[aria-hidden]{flex:none;color:var(--ink-3);font-size:18px}
.strip.quiet{background:var(--card)}
.strip.quiet::before{background:var(--mint)}

.alert{padding:8px 0;font-size:14px;line-height:1.6}
.alert b{font-weight:600}

.donut-wrap{display:flex;align-items:center;gap:18px;margin:2px 0 10px}
.donut-wrap svg{flex:none;width:128px;height:128px}
.donut-sum{font-size:13px;color:var(--ink-2);line-height:1.7}
.donut-sum b{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:22px;color:var(--ink);font-weight:700;display:block}
.crow{display:grid;grid-template-columns:28px 1fr auto;gap:4px 10px;align-items:center;padding:9px 0;width:100%;border:0;background:none;text-align:left}
.crow .ic{font-size:18px;line-height:1;text-align:center}
.crow .nm{font-size:14.5px}
.crow .nm small{color:var(--ink-3);margin-left:6px;font-size:12.5px}
.crow .am{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:15.5px;font-weight:650;text-align:right}
.crow .bar{grid-column:2 / 4;height:5px;border-radius:3px;background:var(--card-2);overflow:hidden}
.crow .bar span{display:block;height:100%;border-radius:3px}
.crow .cc{grid-column:2 / 4;font-size:12.5px;color:var(--ink-2)}
.daily svg{width:100%;height:auto;display:block;overflow:visible}

/* 明细 */
.search{display:flex;gap:10px;margin:2px 0 12px}
.search input{flex:1;min-width:0;border:0;background:var(--card);border-radius:16px;padding:12px 14px;font-size:16px}
.search input::placeholder{color:var(--ink-3)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--card);border-radius:999px;padding:7px 14px;font-size:14px;color:var(--ink-2);white-space:nowrap}
.chip.on{background:var(--chip-on-bg);color:var(--chip-on-ink);font-weight:600}
.chip.x::after{content:"×";margin-left:6px;opacity:.6}
.day-h{display:flex;justify-content:space-between;color:var(--ink-3);font-size:13px;padding:16px 2px 4px;position:sticky;top:calc(74px + env(safe-area-inset-top));background:var(--paper);z-index:2}
.tx{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:9px 0;border:0;width:100%;background:none;text-align:left}
.ebadge{width:42px;height:42px;border-radius:14px;background:var(--card);display:grid;place-items:center;font-size:21px;line-height:1;flex:none;font-weight:650}
.ebadge.none{background:transparent;border:1.5px dashed var(--ink-3);color:var(--ink-3);font-size:17px}
.ck{width:24px;height:24px;margin:0 9px;border-radius:50%;border:1.5px solid var(--ink-3);display:grid;place-items:center;font-size:13px;color:var(--chip-on-ink);font-weight:700}
.tx.sel .ck{background:var(--chip-on-bg);border-color:var(--accent)}
.tx-m{min-width:0;display:block}
.tx-t{display:block;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-s{display:block;font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.tx-s span+span::before{content:"";display:inline-block;width:10px}
.tx-a{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:16px;font-weight:650;text-align:right;white-space:nowrap}
.tx-a small{display:block;font-family:var(--font);font-size:11.5px;font-weight:400;color:var(--ink-3)}
.tx-a.in{color:var(--down)}
.tx.ex .tx-a{color:var(--ink-3)}
.tx.ex .tx-a>span{text-decoration:line-through}
.selbar{position:fixed;left:0;right:0;bottom:calc(74px + env(safe-area-inset-bottom));z-index:9;display:flex;justify-content:center;padding:0 16px 10px;pointer-events:none}
.selbar>div{pointer-events:auto;max-width:608px;width:100%;display:flex;gap:8px;background:var(--paper);border-radius:22px;padding:8px;box-shadow:0 8px 28px rgba(0,0,0,.12)}
.selbar .btn{flex:1}
.fab{position:fixed;right:max(16px,calc(50% - 304px));bottom:calc(86px + env(safe-area-inset-bottom));z-index:8;border:0;background:var(--mint);color:var(--mint-ink);border-radius:24px;padding:15px 22px;font-size:16px;font-weight:600;display:flex;align-items:center;gap:10px;box-shadow:0 6px 20px rgba(30,76,69,.14)}
.fab svg{width:22px;height:22px}
.empty-d{text-align:center;color:var(--ink-2);padding:28px 0 12px;font-size:14px}
.empty-d .doodle{width:150px;display:block;margin:0 auto 10px;color:var(--ink)}
.foot .doodle{color:var(--ink)}
.empty-d b{display:block;color:var(--ink);font-size:16px;font-weight:600;margin-bottom:2px}

/* 按钮与表单 */
.btn{appearance:none;border:0;background:var(--card);color:var(--ink);border-radius:16px;padding:12px 16px;font-weight:550;font-size:15px;text-align:center;text-decoration:none;display:inline-block}
.btn:active{background:var(--card-2)}
.card .btn{background:var(--paper)}
.btn.primary{background:var(--btn-bg);color:var(--btn-ink)}
.btn.danger{color:var(--up)}
.btn.wide{width:100%;display:block}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.field{display:block;margin:12px 0}
.field>span{display:block;font-size:13px;color:var(--ink-2);margin-bottom:6px}
.field input,.field select,.field textarea,.inp{width:100%;border:0;background:var(--card);border-radius:14px;padding:11px 13px;font-size:16px}
.card .field input,.card .field select,.card .field textarea,.card .inp{background:var(--paper)}
.field textarea{min-height:240px;line-height:1.75;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;margin:12px 0;font-size:14.5px}
.check input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.hint{font-size:13px;color:var(--ink-2);margin:6px 0;line-height:1.6}
details.card summary{cursor:pointer;font-weight:600;list-style:none}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"展开";float:right;font-weight:400;font-size:13px;color:var(--ink-3)}
details.card[open] summary::after{content:"收起"}
ol.steps{padding-left:1.2em;margin:10px 0 0}
ol.steps li{margin:8px 0;font-size:14px;color:var(--ink-2)}
ol.steps b{color:var(--ink)}

/* 待确认 */
.todo{background:var(--card);border-radius:20px;padding:14px 16px;margin:0 0 10px}
.todo-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.todo-h b{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.todo-h .tx-a{font-size:18px}
.todo-s{font-size:12.5px;color:var(--ink-3);margin:2px 0 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opts{display:flex;flex-wrap:nowrap;gap:6px}
.opts .chip{background:var(--paper);color:var(--ink);padding:7px 11px;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.opts .chip.more{color:var(--ink-2);letter-spacing:1px;padding:7px 13px;flex:none;margin-left:auto}
.set-acct{padding:12px 0}
.set-acct+.set-acct{border-top:1px solid var(--card-2)}

/* 分类选择 */
.pk-l1{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
.pk-l2{display:flex;gap:8px;flex-wrap:wrap}
.pk-l1 .chip.on{background:var(--ink);color:var(--paper)}

/* 汇报 */
.rp-intro{display:flex;align-items:center;gap:12px;margin:0 0 12px}
.rp-intro .doodle{width:78px;flex:none}
.rp-intro p{margin:0;font-size:14px;color:var(--ink-2);line-height:1.6}
.rp-cmd{display:flex;gap:8px;margin:0 0 10px}
.rp-cmd input{flex:1;min-width:0;border:0;background:var(--card);border-radius:16px;padding:13px 14px;font-size:16px}
.rp-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 10px}
.rp-grid>*{min-width:0}
.field input{min-width:0;-webkit-appearance:none;appearance:none}
.preview img{width:100%;border-radius:18px;display:block;margin:12px 0 10px;box-shadow:0 2px 14px rgba(0,0,0,.08)}

/* 设置 */
.rule{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;font-size:14px}
.rule+.rule{border-top:1px solid var(--card-2)}
.rule span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.foot{text-align:center;color:var(--ink-3);font-size:12.5px;padding:10px 0 4px}
.foot .doodle{width:110px;display:block;margin:0 auto 6px}

/* 欢迎 */
.welcome{text-align:center;padding-top:8px}
.welcome .doodle{width:220px;display:block;margin:8px auto 6px}
.welcome h1{font-size:24px;line-height:1.35;margin:6px 0 8px;font-weight:700}
.welcome>p{color:var(--ink-2);margin:0 auto 18px;max-width:30em;font-size:14.5px}
.welcome details{text-align:left;margin-top:16px}

/* 底部导航 */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);z-index:10}
.tabs-in{max-width:640px;margin:0 auto;display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--ink-2);text-decoration:none;position:relative;border:0;background:none;padding:0;font-family:inherit}
.tab .pill{display:grid;place-items:center;width:64px;height:32px;border-radius:16px}
.tab svg{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--ink);font-weight:600}
.tab[aria-current="page"] .pill{background:var(--pill)}
.tab .bdg{position:absolute;top:-2px;left:calc(50% + 12px);background:var(--up);color:#fff;font-size:10px;line-height:16px;border-radius:8px;padding:0 5px;min-width:16px;text-align:center;font-weight:600}

/* 弹层与提示 */
.backdrop{position:fixed;inset:0;background:rgba(20,20,18,.32);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--paper);border-radius:28px 28px 0 0;max-height:90vh;overflow:auto;padding:10px 18px calc(20px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;animation:up .22s ease-out}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--card-2);margin:0 auto 14px}
.sheet h3{margin:0 0 4px;font-size:19px;font-weight:650}
.sheet .big{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:34px;font-weight:700;margin:2px 0 4px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13.5px;margin:12px 0;color:var(--ink);background:var(--card);border-radius:18px;padding:14px 16px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;word-break:break-all}
.sheet .doodle{width:96px;display:block;margin:0 auto 8px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 16px}
.mcell{border:0;background:var(--card);border-radius:16px;padding:12px 6px;text-align:center}
.mcell b{display:block;font-size:16px;font-weight:650}
.mcell span{display:block;font-size:12px;color:var(--ink-2);font-family:var(--num)}
.mcell.on{background:var(--chip-on-bg);color:var(--chip-on-ink)}
.mcell.on span{color:var(--chip-on-ink)}
.yr{font-size:14px;color:var(--ink-2);font-weight:500;margin:6px 0 0}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:16px;font-size:14px;max-width:calc(100% - 32px);width:max-content;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;white-space:pre-line}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.drop{position:fixed;inset:0;z-index:40;background:rgba(203,236,230,.55);border:3px dashed var(--mint-ink);display:none;place-items:center;font-size:20px;color:var(--mint-ink);font-weight:600}
.drop.on{display:grid}
/* 旺财 */
.wc{display:flex;align-items:flex-end;gap:8px;margin:0 0 14px}
.wc .wangcai{width:96px;flex:none;margin-bottom:4px;display:block}
.bubble{background:var(--card);border-radius:22px 22px 22px 6px;padding:12px 15px;font-size:14px;line-height:1.65;margin-bottom:26px}
.bubble b{font-weight:650}
.wch-row{display:inline-flex;align-items:center;gap:8px}
.wangcai.mini{width:38px;display:block}
.big-emoji{font-size:52px;line-height:1;margin:4px auto 12px;display:block;text-align:center}
.ebadge.mono{font-family:var(--serif);font-weight:400;font-size:17px;color:var(--ink-2)}
.btn svg{width:18px;height:18px;vertical-align:-3.5px;margin-right:7px}
.act-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 12px}
.mpill,.msearch,.frow{display:none}
.empty-card{text-align:center;padding:44px 22px}
.empty-card h3{font-family:var(--serif);font-weight:400;font-size:30px;margin:0 0 10px;letter-spacing:.02em}
.empty-card p{color:var(--ink-2);font-size:15px;margin:0 auto 22px;max-width:24em;line-height:1.7}
.btn.pillb{border-radius:999px;padding:0 28px;display:inline-flex;align-items:center;justify-content:center}

/* 外观切换 */
.themes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.theme-opt{border:1.5px solid transparent;background:var(--paper);border-radius:18px;padding:10px;text-align:left}
.theme-opt.on{border-color:var(--ink)}
.theme-opt b{display:block;font-size:15px;margin-top:8px}
.theme-opt small{display:block;font-size:12px;color:var(--ink-2);line-height:1.5}

function decodeText(buf){
  try { return new TextDecoder('utf-8', {fatal: true}).decode(buf).replace(/^﻿/, ''); }
  catch (e) { return new TextDecoder('gb18030').decode(buf); }
}
function parseCSV(text){
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){
      if (c === '"'){ if (text[i + 1] === '"'){ cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"' && cell === '') q = true;
    else if (c === ','){ row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r'){
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(cell); rows.push(row); row = []; cell = '';
    } else cell += c;
  }
  if (cell !== '' || row.length){ row.push(cell); rows.push(row); }
  return rows.map(r => r.map(s => s.trim()));
}
async function inflateRaw(data){
  if (typeof DecompressionStream === 'undefined') throw new Error('这个浏览器版本较旧，读不了 xlsx。请升级浏览器，或用电脑把账单另存为 CSV 再导入');
  const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function unzip(buf){
  const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  let eocd = -1;
  for (let i = buf.length - 22; i >= Math.max(0, buf.length - 65558); i--){ if (dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; } }
  if (eocd < 0) throw new Error('文件已损坏，不是有效的 xlsx');
  const count = dv.getUint16(eocd + 10, true); let p = dv.getUint32(eocd + 16, true);
  const files = {}; const td = new TextDecoder();
  for (let k = 0; k < count; k++){
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true), elen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true), loff = dv.getUint32(p + 42, true);
    files[td.decode(buf.subarray(p + 46, p + 46 + nlen))] = {method, csize, loff};
    p += 46 + nlen + elen + clen;
  }
  return async name => {
    const f = files[name]; if (!f) return null;
    const start = f.loff + 30 + dv.getUint16(f.loff + 26, true) + dv.getUint16(f.loff + 28, true);
    const data = buf.subarray(start, start + f.csize);
    if (f.method === 0) return data;
    if (f.method === 8) return inflateRaw(data);
    throw new Error('xlsx 使用了不支持的压缩方式');
  };
}
const decodeXml = s => s.replace(/&(#x[0-9a-f]+|#\d+|lt|gt|quot|apos|amp);/gi, (m, e) => {
  if (e[0] === '#') return String.fromCodePoint(e[1] === 'x' || e[1] === 'X' ? parseInt(e.slice(2), 16) : +e.slice(1));
  return {lt:'<', gt:'>', quot:'"', apos:"'", amp:'&'}[e.toLowerCase()];
});
function xmlAttrs(s){ const o = {}; s.replace(/([\w:]+)="([^"]*)"/g, (m, k, v) => { o[k] = v; }); return o; }
async function readXlsx(buf){
  const get = await unzip(buf); const td = new TextDecoder();
  const txt = async n => { const b = await get(n); return b ? td.decode(b) : ''; };
  let sheet = 'xl/worksheets/sheet1.xml';
  const wb = await txt('xl/workbook.xml'), rels = await txt('xl/_rels/workbook.xml.rels');
  const first = /<sheet\b([^>]*)\/?>/.exec(wb);
  if (first){
    const rid = xmlAttrs(first[1])['r:id'];
    for (const m of rels.matchAll(/<Relationship\b([^>]*)\/?>/g)){
      const a = xmlAttrs(m[1]);
      if (a.Id === rid && a.Target){ sheet = a.Target.startsWith('/') ? a.Target.slice(1) : 'xl/' + a.Target.replace(/^\.\//, ''); break; }
    }
  }
  const ssx = await txt('xl/sharedStrings.xml');
  const shared = [...ssx.matchAll(/<si>([\s\S]*?)<\/si>/g)].map(m =>
    decodeXml([...m[1].replace(/<rPh[\s\S]*?<\/rPh>/g, '').matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(x => x[1]).join('')));
  const sx = await txt(sheet);
  if (!sx) throw new Error('xlsx 里没有找到表格');
  const rows = [];
  for (const rm of sx.matchAll(/<row\b[^>]*>([\s\S]*?)<\/row>/g)){
    const row = [];
    for (const cm of rm[1].matchAll(/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)){
      const a = xmlAttrs(cm[1]), inner = cm[2] || '';
      const col = (a.r || '').replace(/\d+/g, '').split('').reduce((n, ch) => n * 26 + ch.charCodeAt(0) - 64, 0) - 1;
      let v = '';
      if (a.t === 's'){ const m = /<v>([\s\S]*?)<\/v>/.exec(inner); v = m ? shared[+m[1]] ?? '' : ''; }
      else if (a.t === 'inlineStr'){ v = decodeXml([...inner.matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(x => x[1]).join('')); }
      else { const m = /<v>([\s\S]*?)<\/v>/.exec(inner); v = m ? decodeXml(m[1]) : ''; }
      row[col >= 0 ? col : row.length] = v;
    }
    rows.push(Array.from(row, x => (x ?? '').trim()));
  }
  return rows;
}
async function readRows(file){
  const buf = new Uint8Array(await file.arrayBuffer());
  if (buf[0] === 0x50 && buf[1] === 0x4B) return readXlsx(buf);
  if (buf[0] === 0xD0 && buf[1] === 0xCF) throw new Error('这是旧版 .xls 格式，请重新导出为 xlsx 或 CSV');
  return parseCSV(decodeText(buf));
}

/* ================= 解析账单 ================= */
const COLS = {
  time:['交易时间','交易创建时间','付款时间'], cat:['交易分类','交易类型','类型'], cp:['交易对方'],
  desc:['商品说明','商品','商品名称'], dir:['收/支','收支'], amount:['金额','金额(元)'],
  method:['收/付款方式','支付方式','付款方式'], status:['交易状态','当前状态'], no:['交易订单号','交易单号','交易号'],
  mno:['商家订单号','商户单号','商户订单号'], note:['备注'], fund:['资金状态'],
};
const normH = s => String(s || '').replace(/[\s　]/g, '').replace(/（/g, '(').replace(/）/g, ')');
function findHeader(rows){
  for (let i = 0; i < Math.min(rows.length, 80); i++){
    const r = rows[i].map(normH);
    if (r.includes('交易对方') && r.some(c => c.startsWith('金额')) && r.some(c => c.includes('时间'))){
      const map = {};
      for (const [k, names] of Object.entries(COLS)){ const idx = r.findIndex(c => names.includes(c)); if (idx >= 0) map[k] = idx; }
      const src = (r.includes('当前状态') || r.includes('商品') || r.includes('支付方式')) ? 'wechat' : 'alipay';
      return {i, map, src};
    }
  }
  return null;
}
function normTime(v){
  const s = String(v ?? '').trim();
  if (/^\d{5}(\.\d+)?$/.test(s)){
    const d = new Date(Math.round((parseFloat(s) - 25569) * 864e5));
    return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())} ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())}`;
  }
  const m = /^(\d{4})[-/.年](\d{1,2})[-/.月](\d{1,2})日?(?:[ T]+(\d{1,2}):(\d{1,2})(?::(\d{1,2}))?)?/.exec(s);
  return m ? `${m[1]}-${pad(m[2])}-${pad(m[3])} ${pad(m[4] || 0)}:${pad(m[5] || 0)}:${pad(m[6] || 0)}` : '';
}
const parseAmount = s => Math.abs(parseFloat(String(s ?? '').replace(/[¥￥,，\s元]/g, '')));
function parseAccount(method){
  let m = clean(method); if (!m) return null;
  m = m.split(/[&＆]/)[0].trim();
  let r = /^(.+?)(储蓄卡|借记卡|信用卡)\s*[(（](\d{3,4})[)）]/.exec(m);
  if (r){ const type = r[2] === '信用卡' ? '信用卡' : '储蓄卡'; return {key: r[1] + type + r[3], bank: r[1], type, tail: r[3]}; }
  r = /^(.+?)\s*[(（](\d{3,4})[)）]/.exec(m);
  if (r) return {key: r[1] + r[2], bank: r[1], type: '银行卡', tail: r[2]};
  if (/^零钱通/.test(m)) return {key: '零钱通', type: '钱包'};
  if (/^零钱/.test(m)) return {key: '微信零钱', type: '钱包'};
  if (/余额宝/.test(m)) return {key: '余额宝', type: '钱包'};
  if (/花呗/.test(m)) return {key: '花呗', type: '信用'};
  if (/^(账户)?余额$/.test(m)) return {key: '支付宝余额', type: '钱包'};
  return {key: m, type: '其他'};
}
function toTx(r, map, src){
  const g = k => map[k] != null ? String(r[map[k]] ?? '').trim() : '';
  const time = normTime(g('time')); if (!time) return null;
  const amount = parseAmount(g('amount')); if (!(amount > 0)) return null;
  const dirRaw = g('dir');
  let dir = /支出/.test(dirRaw) ? 'out' : /收入/.test(dirRaw) ? 'in' : 'none';
  if (dir === 'none' && map.fund != null){ const f = g('fund'); if (/已支出/.test(f)) dir = 'out'; else if (/已收入/.test(f)) dir = 'in'; }
  const status = g('status'), pcat = clean(g('cat')), cp = clean(g('cp')), desc = clean(g('desc'));
  const refund = dir !== 'out' && /退款/.test(`${status} ${pcat} ${desc}`);
  const kind = refund ? 'refund' : dir === 'out' ? 'expense' : dir === 'in' ? 'income' : 'transfer';
  const no = clean(g('no')).replace(/\s/g, ''), method = clean(g('method')), acc = parseAccount(method);
  return {
    id: `${src}:${no || hashStr([time, amount, cp, desc, dirRaw].join('|'))}${refund ? ':r' : ''}`,
    src, time, ts: parseTs(time), amount: round2(amount), kind, cp, desc, pcat, status, method,
    acct: acc ? acc.key : '', no, billNote: clean(g('note')), note: '',
    cat: '', catBy: '', exclude: false, exBy: '', exReason: '', origId: '', aiOpts: null,
  };
}
function parseBill(rows, fileName){
  const h = findHeader(rows);
  if (!h) throw new Error('没找到账单表头（交易时间、交易对方、金额）。请确认是微信或支付宝导出的原始文件');
  const pre = rows.slice(0, h.i).map(r => r.join(' ')).join(' ') + ' ' + (fileName || '');
  let src = h.src;
  if (/微信/.test(pre)) src = 'wechat'; else if (/支付宝|alipay/i.test(pre)) src = 'alipay';
  const txs = [];
  for (let i = h.i + 1; i < rows.length; i++){
    const r = rows[i]; if (!r || r.every(c => !String(c || '').trim())) continue;
    if (/^-{3,}/.test(String(r[0] || ''))) break;
    const t = toTx(r, h.map, src); if (t) txs.push(t);
  }
  return {src, txs};
}

function classify(t){

function txBadge(t){

  if (t.kind === 'transfer') return `<span class="ebadge${m ? ' mono' : ''}">${m ? '转' : '🔁'}</span>`;

  return e ? `<span class="ebadge">${e}</span>` : `<span class="ebadge mono">${esc(l2Of(t.cat).slice(0, 1))}</span>`;
}
function txRow(t, sel){
  const title = t.cp || t.desc || (t.kind === 'transfer' ? '资金转移' : '未命名');
  const subParts = [t.cat ? l2Of(t.cat) : t.kind === 'income' ? '收入' : t.kind === 'transfer' ? '不计收支' : '待分类'];
  if (t.desc && t.desc !== t.cp && !/^美团订单|^订单/.test(t.desc)) subParts.push(t.desc);
  if (t.acct) subParts.push(acctName(t.acct));

  if (t.kind === 'expense') amt = '-' + fmtNum(t.amount);
  else if (t.kind === 'refund' || t.kind === 'income'){ amt = '+' + fmtNum(t.amount); cls = 'in'; }
  else amt = fmtNum(t.amount);
  const note = t.exclude ? (t.exReason || '不计入') : t.kind === 'refund' ? '退款' : t.kind === 'transfer' ? '不计入' : '';

  return `<button class="tx ${ex ? 'ex' : ''} ${sel && sel.has(t.id) ? 'sel' : ''}" data-act="${sel ? 'toggle' : 'edit'}" data-id="${esc(t.id)}">
    ${lead}<span class="tx-m"><span class="tx-t">${esc(title)}</span><span class="tx-s">${t.cat ? `<i class="cdot" style="background:${catColor(l1Of(t.cat))}"></i>` : ''}${subParts.map(s => `<span>${esc(s)}</span>`).join('')}</span></span>
    <span class="tx-a ${cls}"><span>${amt}</span>${note ? `<small>${esc(note)}</small>` : ''}</span></button>`;
}
function filteredList(){
  const f = ui.f, q = f.q.trim().toLowerCase();
  return state.txs.filter(t => {
    if (!t.time.startsWith(ui.month)) return false;
    if (f.kind === 'out' && !(t.kind === 'expense' || t.kind === 'refund')) return false;
    if (f.kind === 'in' && t.kind !== 'income') return false;
    if (f.kind === 'ex' && !(t.exclude || t.kind === 'transfer')) return false;
    if (f.cat){ if (f.cat === '待分类'){ if (t.cat) return false; } else if (f.cat.includes('/') ? t.cat !== f.cat : l1Of(t.cat) !== f.cat) return false; }
    if (f.acct && t.acct !== f.acct) return false;
    if (f.seg && (spendOf(t) === 0 || segOf(t) !== f.seg)) return false;
    if (q && !`${t.cp} ${t.desc} ${t.note} ${t.cat} ${acctName(t.acct)} ${t.amount}`.toLowerCase().includes(q)) return false;
    return true;
  }).sort((a, b) => b.ts - a.ts);
}

function listBody(list){
  if (!list.length) return `<div class="empty-d">${isMin() ? '' : '<div class="big-emoji">🔍</div>'}<b>没有符合条件的交易</b>换个关键词，或者切换月份看看</div>`;

  } else if (tpl === 'pie'){
    const cx = W / 2, cy = y + 320, R = 240, rr = 160; let a = -Math.PI / 2;
    for (const [k, v] of cats){

      c.beginPath(); c.arc(cx, cy, R, a, a + ang); c.arc(cx, cy, rr, a + ang, a, true); c.closePath();

      a += ang;
    }
    c.textAlign = 'center'; c.fillStyle = ink2; c.font = `400 30px ${F}`; c.fillText(cats[0] ? `最多：${cats[0][0]}` : '', cx, cy - 10);
    c.fillStyle = ink; c.font = TF(56); c.fillText(cats[0] ? `${(cats[0][1] / total * 100).toFixed(0)}%` : '', cx, cy + 52); c.textAlign = 'left';
    y = cy + R + 50;
    cats.forEach(([k, v], i) => {
      y += 84;
      c.fillStyle = k === '待分类' ? ink3 : catColor(k); c.beginPath(); c.arc(P + 14, y - 24, 12, 0, Math.PI * 2); c.fill();
      c.fillStyle = ink; c.font = `500 34px ${F}`; c.fillText(`${l1Emoji(k) ? l1Emoji(k) + ' ' : ''}${k}`, P + 44, y - 12);

const aiReady = () => { const a = state.settings.ai; return !!(a.base && a.model && a.key); };
async function aiChat(messages){
  const a = state.settings.ai;
  if (!aiReady()) throw new Error('还没有设置 AI');
  let res;
  try {
    res = await fetch(a.base.replace(/\/+$/, '') + '/chat/completions', {
      method: 'POST', headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + a.key},
      body: JSON.stringify({model: a.model, messages, temperature: 0.1}),
    });
  } catch (e) { throw new Error('连不上 AI 服务。可能是没联网，或者这家服务不允许网页直接调用，可以换一家试试'); }
  if (!res.ok){ const tx = await res.text().catch(() => ''); throw new Error(`AI 服务返回错误 ${res.status}${res.status === 401 ? '：API Key 不对' : ''} ${tx.slice(0, 120)}`); }
  const j = await res.json();
  return (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '';
}
function extractJSON(s){
  const fence = /```(?:json)?\s*([\s\S]*?)```/.exec(s); const t = fence ? fence[1] : s;
  const i = t.search(/[\[{]/); if (i < 0) return null;
  const close = t[i] === '[' ? ']' : '}'; const k = t.lastIndexOf(close);
  try { return JSON.parse(t.slice(i, k + 1)); } catch (e) { return null; }
}
async function aiClassify(btn){
  const items = pendingTxs().sort((a, b) => b.amount - a.amount).slice(0, 60);
  if (!items.length) return;
  btn.disabled = true; btn.textContent = '旺财正在嗅一嗅…';
  try {
    const payload = items.map((t, i) => ({i, 商户: t.cp, 商品: t.desc, 金额: t.amount, 平台分类: t.pcat}));
    const out = await aiChat([
      {role: 'system', content: '你是个人记账的分类助手。只能从给定的分类里选，只输出 JSON 数组。'},
      {role: 'user', content: `分类（一级/二级）：${allCats().join('、')}\n\n为每条消费判断分类。输出：[{"i":0,"cat":"一级/二级","conf":"high 或 low","options":["一级/二级","一级/二级","一级/二级"]}]。只有很有把握时 conf 才写 high；options 是最可能的 3 个分类。\n\n${JSON.stringify(payload)}`},
    ]);
    const arr = extractJSON(out); if (!Array.isArray(arr)) throw new Error('AI 返回的格式不对，请再试一次');
    let hi = 0, lo = 0;
    for (const o of arr){
      const t = items[o.i]; if (!t) continue;
      const opts = (o.options || []).filter(catExists);
      if (o.conf === 'high' && catExists(o.cat)){ t.cat = o.cat; t.catBy = 'ai'; hi++; }
      else { t.aiOpts = [o.cat, ...opts].filter(catExists).slice(0, 3); lo++; }
    }
    save(); toast(`${aiName()}分好了 ${hi} 笔${lo ? `，另外 ${lo} 笔给出了建议，等你确认` : ''}`); render();
  } catch (e) { toast(e.message); btn.disabled = false; btn.textContent = '让旺财再试一次'; }
}

// 在网页版里通过平台的保存功能下载；本地打开时直接下载
async function download(name, blob){
  if (window.claude && typeof window.claude.use === 'function'){
    try {
      const dl = await window.claude.use('downloads');
      if (dl){ await dl.save({filename: name, data: blob}); return true; }
    } catch (e) {
      if (!e || e.code !== 'declined') toast('没能保存：' + ((e && e.message) || '这里暂时不支持下载'));
      return false;
    }
  }
  const url = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
  return true;
}

async function importFiles(files){
  if (!files || !files.length) return;
  const ids = new Set(state.txs.map(t => t.id));
  const lines = []; let added = 0, newAcc = 0;
  for (const f of files){
    try {
      const rows = await readRows(f);
      const {src, txs} = parseBill(rows, f.name);
      if (!txs.length) throw new Error('文件里没有读到交易记录');
      let a = 0, d = 0;
      for (const t of txs){
        if (ids.has(t.id)){ d++; continue; }
        ids.add(t.id); state.txs.push(t); a++;
        const acc = parseAccount(t.method);
        if (acc && !state.accounts[acc.key]){ state.accounts[acc.key] = {bank: acc.bank || '', type: acc.type, tail: acc.tail || '', alias: '', billDay: '', dueDay: '', seen: false}; newAcc++; }
      }
      added += a;
      lines.push(`${src === 'wechat' ? '微信' : '支付宝'}账单：新增 ${a} 笔${d ? `，${d} 笔之前导入过，已跳过` : ''}`);
    } catch (e) { lines.push(`「${f.name}」没导入：${e.message}`); }
  }
  state.txs.sort((a, b) => b.ts - a.ts);
  recompute(); save();
  if (added){ const ms = monthsWithData(); if (!hasData(ui.month)) ui.month = ms.includes(curYm()) ? curYm() : ms[ms.length - 1]; }
  const pend = pendingTxs().length;
  openSheet(`${added && !isMin() ? '<div class="big-emoji">🎉</div>' : ''}<h3 style="text-align:center">${added ? '导入完成' : '没有新记录'}</h3>
    <ul style="padding-left:1.2em;margin:12px 0">${lines.map(l => `<li style="margin:4px 0">${esc(l)}</li>`).join('')}</ul>
    ${added ? `<p class="hint">退款、转账、还信用卡等已自动排除，不算进支出。${newAcc ? `认出了 ${newAcc} 个付款账户。` : ''}${pend ? `有 ${pend} 笔消费认不出是什么，需要你点一下确认。` : '所有消费都已自动归类。'}</p>` : ''}
    <div class="row" style="margin-top:14px">${pend || newAcc ? `<button class="btn primary" data-act="go" data-k="todo">去确认</button>` : ''}<button class="btn ${pend || newAcc ? '' : 'primary'}" data-act="go" data-k="home">看概览</button></div>`);
  render();
}

  pickm: el => { ui.month = el.dataset.k; ui.drill = null; ui.select = null; closeSheet(); render(); },
  drill: el => { ui.drill = el.dataset.c || null; render(); },
  gocat: el => { ui.f = {q: '', kind: 'out', cat: el.dataset.c, acct: '', seg: ''}; go('list'); },
  goseg: el => { ui.f = {q: '', kind: 'out', cat: '', acct: '', seg: el.dataset.k}; go('list'); },
  goacct: el => { ui.f = {q: '', kind: 'out', cat: '', acct: el.dataset.k, seg: ''}; go('list'); },
  go: el => go(el.dataset.k),
  month: el => stepMonth(+el.dataset.k),
  fkind: el => { ui.f.kind = el.dataset.k; if (el.closest('.sheet')) closeSheet(); render(); },
  fseg: el => { ui.f.seg = el.dataset.k; closeSheet(); render(); },
  fclear: el => { ui.f[el.dataset.k] = el.dataset.k === 'kind' ? 'out' : ''; render(); },
  multi: () => { ui.select = ui.select ? null : new Set(); closeSheet(); render(); },
  fsheet: () => openSheet(`<h3>筛选</h3>
    <div class="field"><span>类型</span><div class="chips" style="flex-wrap:wrap">${[['out', '支出'], ['in', '收入'], ['ex', '不计入'], ['all', '全部']].map(([k, n]) => `<button class="chip ${ui.f.kind === k ? 'on' : ''}" data-act="fkind" data-k="${k}">${n}</button>`).join('')}</div></div>
    <div class="field"><span>支出类别</span><div class="chips" style="flex-wrap:wrap">${[['', '全部'], ['var', '日常'], ['fixed', '固定'], ['big', '大额']].map(([k, n]) => `<button class="chip ${ui.f.seg === k ? 'on' : ''}" data-act="fseg" data-k="${k}">${n}</button>`).join('')}</div></div>
    <button class="btn wide" data-act="multi" style="margin-top:8px">${ui.select ? '退出多选' : '多选几笔，生成汇报图片'}</button>`),
  toggle: el => { const id = el.dataset.id; ui.select.has(id) ? ui.select.delete(id) : ui.select.add(id); render(); },
  selall: () => { filteredList().filter(t => t.kind === 'expense').forEach(t => ui.select.add(t.id)); render(); },
  selreport: () => { const r = newRep(); r.ids = [...ui.select]; ui.rep = r; ui.select = null; go('report'); },
  edit: el => openEdit(el.dataset.id),
  pk1: el => { ui.pk = el.dataset.c; const box = $('#pk'); if (box) box.innerHTML = pickerHTML(editing ? editing.cat : ''); },
  pk2: el => {
    if (!editing) return; editing.cat = el.dataset.c;
    if (editing.add){ $('#pk').innerHTML = pickerHTML(editing.cat); return; }
    const l = $('#learn'); if (l) editing.learn = l.checked;
    const ex = $('#exclude'), note = $('#note'); const keep = {ex: ex && ex.checked, note: note && note.value};
    const sc = $('.sheet') ? $('.sheet').scrollTop : 0;
    drawEdit();
    if ($('#exclude')) $('#exclude').checked = keep.ex; if ($('#note')) $('#note').value = keep.note || '';
    if ($('.sheet')) $('.sheet').scrollTop = sc;
  },
  saveedit: () => saveEdit(),
  deltx: () => { const id = editing.id; askConfirm('这笔手动记录会被删除。', '删除', () => { state.txs = state.txs.filter(t => t.id !== id); touch(); save(); render(); toast('已删除'); }); },
  confirmok: () => { const fn = pendingConfirm; pendingConfirm = null; closeSheet(); if (fn) fn(); },
  saveimg: () => { const r = ui.rep; if (r && r.blob) download(`${repTitle(r)}.png`, r.blob).then(ok => { if (ok) toast('图片已保存'); }); },
  add: () => openAdd(),
  addkind: el => { editing.kind = el.dataset.k; document.querySelectorAll('[data-act="addkind"]').forEach(b => b.classList.toggle('on', b === el)); $('#a-catf').style.display = editing.kind === 'expense' ? '' : 'none'; },
  saveadd: () => saveAdd(),
  quick: el => { const t = byId(el.dataset.id); if (!t) return; const {rule, n} = applyCategory(t, el.dataset.c, true); toast(rule ? `已记住：${ruleText(rule)} → ${l2Of(el.dataset.c)}${n ? `，另有 ${n} 笔一起归类` : ''}` : `已归入「${l2Of(el.dataset.c)}」`); render(); },
  acctok: el => { const k = el.dataset.k; const inp = document.querySelector(`[data-alias="${CSS.escape(k)}"]`); state.accounts[k].alias = inp ? inp.value.trim() : ''; state.accounts[k].seen = true; save(); render(); },
  aicls: el => aiClassify(el),
  cmd: async () => {
    const text = ($('#cmd').value || '').trim(); if (!text) return toast('先说说你想要什么图');
    let r = parseCommand(text);
    if (aiReady()){ try { toast(`${aiName()}正在理解…`); r = await aiCommand(text); } catch (e) { toast(`${aiName()}没理解成功，已按常见说法设置：` + e.message); } }
    ui.rep = r; render(); toast('已按你的话设置好，确认后点「生成图片」');
  },
  cmdex: el => { $('#cmd').value = el.dataset.c; A.cmd(); },
  represet: () => { ui.rep = newRep(); render(); },
  rpcat: el => { const r = ui.rep, c = el.dataset.c; r.cats = r.cats.includes(c) ? r.cats.filter(x => x !== c) : [...r.cats.filter(x => !(x.includes('/') && l1Of(x) === c)), c]; r.img = null; render(); },
  rptpl: el => { ui.rep.tpl = el.dataset.k; ui.rep.img = null; render(); },
  rptoggle: el => { const r = ui.rep, id = el.dataset.id; r.off.has(id) ? r.off.delete(id) : r.off.add(id); r.img = null; render(); },
  draw: () => {
    const r = ui.rep; const cv = drawReport(r);
    cv.toBlob(b => { if (r.img) URL.revokeObjectURL(r.img); r.blob = b; r.img = URL.createObjectURL(b); render(); const p = $('#preview'); if (p) p.scrollIntoView({behavior: 'smooth', block: 'start'}); }, 'image/png');
  },
  catsreset: () => { $('#cats').value = DEFAULT_CATS.map(([n, s]) => `${n}：${s.join('、')}`).join('\n'); toast('已填入默认分类，点「保存分类」生效'); },
  catssave: () => {
    const cats = [];
    for (const line of $('#cats').value.split('\n')){
      const [name, rest] = line.split(/[:：]/); if (!name || !name.trim()) continue;
      const subs = [...new Set((rest || '').split(/[、,，\s]+/).map(x => x.trim().replace(/\//g, '')).filter(Boolean))];
      cats.push({name: name.trim().replace(/\//g, ''), subs: subs.length ? subs : ['其他']});
    }
    if (!cats.length) return toast('至少要有一个分类');
    if (!cats.some(c => c.name === '其他')) cats.push({name: '其他', subs: ['其他']});
    state.cats = cats; recompute(); save(); toast('分类已保存'); render();
  },
  addrule: () => { const kw = $('#kw').value.trim(); if (!kw) return toast('先填一个关键词'); state.rules.unshift({id: uid(), type: 'kw', value: kw, cat: $('#kwcat').value}); recompute(); save(); toast('规则已添加'); render(); },
  delrule: el => { state.rules = state.rules.filter(r => r.id !== el.dataset.id); recompute(); save(); render(); },
  savecfg: () => { const b = +$('#big').value; if (b > 0) state.settings.big = b; state.settings.fixedL1 = $('#fixed').value.split(/[、,，\s]+/).map(x => x.trim()).filter(Boolean); save(); toast('已保存'); render(); },
  aisave: () => { readAiForm(); save(); toast('AI 设置已保存'); },
  aitest: async el => { readAiForm(); el.disabled = true; try { const out = await aiChat([{role: 'user', content: '只回复两个字：好的'}]); toast('连接成功：' + out.slice(0, 20)); save(); } catch (e) { toast(e.message); } el.disabled = false; },
  backup: () => {
    const blob = new Blob([JSON.stringify({app: 'billbook', exportedAt: new Date().toISOString(), state})], {type: 'application/json'});
    download(`账本备份-${ymd(new Date())}.json`, blob).then(ok => { if (!ok) return; state.settings.lastBackup = Date.now(); save(); toast('备份已导出，请把文件存到网盘或者发给自己'); render(); });
  },
  restore: () => $('#restore').click(),
  csv: () => {
    const head = ['时间', '类型', '金额', '一级分类', '二级分类', '交易对方', '商品说明', '账户', '来源', '状态', '计入支出', '备注'];
    const kn = {expense: '支出', refund: '退款', income: '收入', transfer: '不计收支'};
    const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const rows = state.txs.map(t => [t.time, kn[t.kind], t.amount, l1Of(t.cat), l2Of(t.cat), t.cp, t.desc, acctName(t.acct), {wechat: '微信', alipay: '支付宝', manual: '手动'}[t.src], t.status, spendOf(t) ? '是' : '否', t.note].map(q).join(','));
    download(`账本-${ymd(new Date())}.csv`, new Blob(['﻿' + [head.join(','), ...rows].join('\r\n')], {type: 'text/csv'})).then(ok => { if (ok) toast('表格已导出'); });
  },
  wipe: () => askConfirm('所有账单记录、规则和账户都会被删除，无法恢复。建议先导出备份。', '清空所有数据', () => { const ai = state.settings.ai, theme = state.settings.theme; state = freshState(); state.settings.ai = ai; state.settings.theme = theme; touch(); save(); ui.rep = null; toast('已清空'); go('home'); }),
};
function readAiForm(){
  const a = state.settings.ai;
  a.preset = $('#ai-preset').value; a.base = $('#ai-base').value.trim(); a.model = $('#ai-model').value.trim(); a.key = $('#ai-key').value.trim();
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = A[el.dataset.act]; if (!fn) return;
  if (el.tagName !== 'A') e.preventDefault();
  fn(el, e);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q'){ ui.f.q = t.value; const lb = $('#lb'); if (lb) lb.innerHTML = listBody(filteredList()); }
  else if (t.dataset.alias){ const a = state.accounts[t.dataset.alias]; if (a){ a.alias = t.value.trim(); if (a.alias) a.seen = true; save(); } }
  else if (t.dataset.bill){ const a = state.accounts[t.dataset.bill]; if (a){ a.billDay = t.value; save(); } }
  else if (t.dataset.due){ const a = state.accounts[t.dataset.due]; if (a){ a.dueDay = t.value; save(); } }
  else if (t.dataset.rp === 'title'){ ui.rep.title = t.value; ui.rep.img = null; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.rp && t.dataset.rp !== 'title'){ ui.rep[t.dataset.rp] = t.value; ui.rep.off = new Set(); ui.rep.img = null; render(); }
  else if (t.dataset.rpck){ ui.rep[t.dataset.rpck] = t.checked; ui.rep.img = null; render(); }
  else if (t.id === 'f-acct'){ ui.f.acct = t.value; render(); }
  else if (t.id === 'f-cat'){ ui.f.cat = t.value; render(); }
  else if (t.id === 'learn' && editing) editing.learn = t.checked;
  else if (t.id === 'ai-preset'){ const p = AI_PRESETS[t.value]; if (p && p.base){ $('#ai-base').value = p.base; $('#ai-model').value = p.model; } }
  else if (t.id === 'file'){ importFiles([...t.files]); t.value = ''; }
  else if (t.id === 'restore' && t.files[0]){
    const f = t.files[0]; t.value = '';
    f.text().then(txt => {
      const o = JSON.parse(txt); const s = o && o.state;
      if (!s || !Array.isArray(s.txs)) throw new Error();
      askConfirm(`备份里有 ${s.txs.length} 条记录，恢复后会替换现在的数据。`, '恢复备份', () => { adopt(s); applyTheme(); recompute(); save(); toast('已从备份恢复'); go('home'); });
    }).catch(() => toast('这个文件不是本账本导出的备份'));
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#sheet-root').innerHTML) closeSheet();
  if (e.key === 'Enter' && e.target.id === 'cmd') A.cmd();
});
// 左右滑动切换月份
let swipe = null;
$('#main').addEventListener('touchstart', e => {
  if (!(ui.tab === 'home' || ui.tab === 'list') || ui.select || !state.txs.length || e.target.closest('.chips,input,textarea,select')) return;
  const p = e.touches[0]; swipe = {x: p.clientX, y: p.clientY, t: Date.now()};
}, {passive: true});
$('#main').addEventListener('touchend', e => {
  if (!swipe) return; const p = e.changedTouches[0];
  const dx = p.clientX - swipe.x, dy = p.clientY - swipe.y, fast = Date.now() - swipe.t < 700; swipe = null;
  if (fast && Math.abs(dx) > 70 && Math.abs(dy) < 50) stepMonth(dx < 0 ? 1 : -1);
}, {passive: true});
// 电脑上拖文件进来
let dragN = 0;
window.addEventListener('dragenter', e => { if ([...(e.dataTransfer.types || [])].includes('Files')){ dragN++; $('#drop').classList.add('on'); } });
window.addEventListener('dragleave', () => { if (--dragN <= 0){ dragN = 0; $('#drop').classList.remove('on'); } });
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => { e.preventDefault(); dragN = 0; $('#drop').classList.remove('on'); importFiles([...e.dataTransfer.files]); });
// 切换页面：直接渲染，不依赖链接跳转（有些浏览器或预览环境会拦下链接）
function go(k){
  if (!TABS.some(t => t[0] === k)) k = 'home';
  ui.tab = k; if (k !== 'list') ui.select = null;
  closeSheet(); render(); window.scrollTo(0, 0);
  try { if (location.hash !== '#' + k) location.hash = k; } catch (e) { /* 改不了地址也没关系 */ }
}
function route(){
  const h = location.hash.slice(1);
  ui.tab = TABS.some(t => t[0] === h) ? h : 'home';
  if (ui.tab !== 'list') ui.select = null;
  closeSheet(); render(); window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);

/* ================= 启动 ================= */
loadState();
applyTheme();
recompute();
// 放到网址上（https）时：可以添加到主屏幕，打开过一次以后没网也能用
/* pwa-start */
if (location.protocol === 'https:'){
  const link = (rel, href) => { const l = document.createElement('link'); l.rel = rel; l.href = href; document.head.appendChild(l); };
  link('manifest', 'manifest.webmanifest'); link('apple-touch-icon', 'icon-180.png');
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
}
/* pwa-end */
{ const ms = monthsWithData(); if (ms.length && !hasData(ui.month)) ui.month = ms.includes(curYm()) ? curYm() : ms[ms.length - 1]; }
route();
</script>
</body>
</html>
